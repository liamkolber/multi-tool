<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liam's Multi-Tool</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/shell.css" />
  <link rel="stylesheet" href="/styles/media.css" />
  <link rel="stylesheet" href="/styles/downloader.css" />
  <link rel="stylesheet" href="/styles/convert.css" />
  <link rel="stylesheet" href="/styles/library.css" />
  <link rel="stylesheet" href="/styles/utils.css" />
  <link rel="stylesheet" href="/styles/reddit.css" />
</head>
<body>
  <div class="shell">
    <!-- Tool rail — filled by the shell from the tool registry. -->
    <nav class="rail" id="rail" aria-label="Tools"></nav>

    <div class="stage" id="stage">
      <section class="home" id="home">
        <header class="home-head">
          <h1 class="home-title"><span class="home-mark">🧰</span> Liam's Multi-Tool</h1>
          <p class="home-sub">Everything in one place — pick a tool to get started.</p>
        </header>
        <div class="home-grid" id="home-grid"></div>
      </section>
      <!-- One .tool-panel per tool is appended here by app.js. -->
    </div>
  </div>

  <!-- Shared detail modal — any tool may use it. -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close aria-label="Close">✕</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
